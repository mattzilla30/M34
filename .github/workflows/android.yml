name: Build Android 17 ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list > /tmp/sdk-packages.txt
          if grep -q 'platforms;android-37.0 ' /tmp/sdk-packages.txt; then
            sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          else
            sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
          fi
      - name: Test catalog
        run: bash scripts/test.sh
      - name: Build signed ARM64 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/build.py --sdk "$ANDROID_HOME"
      - name: Verify package constraints
        run: python3 scripts/verify.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: M34-android17-arm64
          path: dist/M34-*-android17-arm64.apk
