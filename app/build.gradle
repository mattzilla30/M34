plugins { id 'com.android.application' }

android {
    namespace 'com.m34.viewer'
    compileSdk 37
    defaultConfig {
        applicationId 'com.m34.viewer'
        minSdk 37
        targetSdk 37
        versionCode rootProject.file('VERSION_CODE').text.trim().toInteger()
        versionName rootProject.file('VERSION').text.trim()
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

// The direct SDK builder also creates this library. Use an Android NDK clang
// on other hosts by setting CC to its aarch64-linux-android37-clang executable.
tasks.register('buildArm64Gate', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/native.py'
    inputs.file 'src/main/cpp/architecture.c'
    outputs.file 'src/main/jniLibs/arm64-v8a/libm34.so'
}
tasks.named('preBuild').configure { dependsOn 'buildArm64Gate' }
